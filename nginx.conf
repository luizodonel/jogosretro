server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript application/wasm;

    # Serve emulatorjs static files directly with 404 on missing (never rewrite to index.html)
    location /emulatorjs/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Cache static assets, covers, ROMs and WASM emulator cores
    location ~* \.(?:ico|css|js|gif|jpe?g|png|wasm|json|data|smc|sfc|zip|nes|gba|gb|gbc|md|bin|gen)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
